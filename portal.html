<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal A2 — Área Cuadrada</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/iso.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="site site-portal">
  <div class="wrap nav">
    <a href="portal.html" class="brand" aria-label="Portal A2"><img src="img/logo-sd.png" alt="Área Cuadrada"></a>
    <ul class="nav-portal">
      <li><button type="button" class="nav-login" id="hdr-logout">Cerrar sesión</button></li>
    </ul>
  </div>
</header>


<div class="demo-bar"><b>Modo demostración</b><span>Todavía no está conectado a Supabase: no se crean cuentas ni se envían correos.</span></div>

<main class="portal">
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="portal-col wide" style="max-width:1000px">
    <div class="card" id="c-load"><div class="panel"><p class="sub" style="margin:0">Cargando…</p></div></div>

    <div id="dash" hidden>
      <div class="dash-head">
        <div>
          <span class="tag" id="d-rol">Portal A2</span>
          <h1 id="d-hola">Hola</h1>
          <div class="who" id="d-who"></div>
        </div>
        <div class="dash-actions"><a class="btn dark" href="usuarios.html" id="go-users" hidden>Usuarios</a></div>
      </div>


      <section style="margin-top:40px">
        <h2 class="h2" style="font-size:24px;margin:0 0 14px">Tu información</h2>
        <div class="tiles" id="tiles"></div>
        <p class="note" style="margin-top:18px">El contenido de cada área lo definimos en la siguiente etapa.</p>
      </section>
    </div>
  </div>
</main>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var $ = function(s){return document.querySelector(s)};
  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  A2Portal.me().then(function(me){
    if (!me) { location.href = 'login.html?next=portal.html'; return; }
    $('#c-load').hidden = true; $('#dash').hidden = false;
    if (me.sinPerfil) { $('#d-hola').textContent = 'Tu perfil no está completo'; $('#d-who').textContent = me.correo + ' · Contactá a Gerencia.'; return; }
    var roles = {owner:'Owner', gerente:'Gerente', colaborador:'Colaborador'};
    $('#d-rol').textContent = roles[me.rol] || 'Portal A2';
    $('#d-hola').textContent = 'Hola, ' + (me.nombres || '').split(' ')[0];
    $('#d-who').textContent = [me.puesto, A2Portal.areaName(me.area), me.correo].filter(Boolean).join(' · ');
    $('#tiles').innerHTML = (me.areas || []).map(function(a){ return '<div class="tile"><h3>' + esc(A2Portal.areaName(a)) + '</h3><p>Contenido por definir.</p></div>'; }).join('') || '<div class="tile"><h3>Sin áreas asignadas</h3><p>Pedile a Gerencia que te asigne acceso.</p></div>';
    if (me.rol === 'owner' || me.rol === 'gerente') $('#go-users').hidden = false;
  }).catch(function(m){ $('#c-load').innerHTML = '<div class="panel"><p class="err-box">' + esc(m) + '</p></div>'; });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/portal.js"></script>
<script src="js/site.js"></script>
</body>
</html>
